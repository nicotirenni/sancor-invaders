<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sancor Invaders</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const W = 800, H = 600;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Sprites -> puntos ----------
const STEP = 6;
function sample(w, h, draw, tint) {
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const g = o.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  draw(g, w, h);
  const d = g.getImageData(0, 0, w, h).data, pts = [];
  for (let y = STEP / 2; y < h; y += STEP)
    for (let x = STEP / 2; x < w; x += STEP) {
      const i = (Math.floor(y) * w + Math.floor(x)) * 4;
      if (d[i] + d[i + 1] + d[i + 2] > 150)
        pts.push({ x, y, c: tint || `rgb(${d[i]},${d[i + 1]},${d[i + 2]})` });
    }
  return pts;
}
function textSprite(txt, w, h, color) {
  return sample(w, h, (g) => {
    g.fillStyle = color; g.textBaseline = 'middle'; g.textAlign = 'center';
    let size = h;
    g.font = `900 ${size}px Arial Black, Impact, sans-serif`;
    while (g.measureText(txt).width > w - 4) { size -= 2; g.font = `900 ${size}px Arial Black, Impact, sans-serif`; }
    g.fillText(txt, w / 2, h / 2 + 2);
  });
}
const flagSprite = () => sample(96, 72, (g, w, h) => {
  g.fillStyle = '#74c0f5'; g.fillRect(0, 0, w, h / 3);
  g.fillStyle = '#ffffff'; g.fillRect(0, h / 3, w, h / 3);
  g.fillStyle = '#74c0f5'; g.fillRect(0, 2 * h / 3, w, h / 3);
  g.fillStyle = '#ffc928'; g.beginPath(); g.arc(w / 2, h / 2, 9, 0, 7); g.fill();
});
const ballSprite = () => sample(84, 84, (g, w, h) => {
  g.fillStyle = '#fff'; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 2, 0, 7); g.fill();
  g.fillStyle = '#000';
  g.beginPath(); // pentagono central
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; g.lineTo(w / 2 + Math.cos(a) * 14, h / 2 + Math.sin(a) * 14); }
  g.fill();
  for (let i = 0; i < 5; i++) { // parches
    const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
    g.beginPath(); g.arc(w / 2 + Math.cos(a) * 28, h / 2 + Math.sin(a) * 28, 7, 0, 7); g.fill();
  }
});

// ---------- Estado ----------
let state = 'menu', wave = 1, score = 0, respect = 100, flash = 0, msg = '', msgT = 0;
let dots = [], bullets = [], parts = [], form = { x: 0, y: 0, vx: 40, vy: 4 };
const ship = { x: W / 2, y: H - 40, cd: 0 };
const keys = {};
let touching = false;

const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.3 + .3, p: Math.random() * 6 }));

function buildWave() {
  dots = [];
  const add = (pts, ox, oy, ally) => pts.forEach(p => dots.push({ x: p.x + ox, y: p.y + oy, c: p.c, ally, alive: true, ph: Math.random() * 6 }));
  add(textSprite('SANCOR', 470, 76, '#ff5a78'), 165, 0, false);
  add(textSprite('SEGUROS', 470, 76, '#ff5a78'), 165, 84, false);
  add(flagSprite(), 30, 40, true);
  add(ballSprite(), 686, 38, true);
  form.x = 0; form.y = 30;
  form.vx = (form.vx < 0 ? -1 : 1) * (40 + wave * 12);
  form.vy = 3 + wave * 1.5;
}
function start() {
  wave = 1; score = 0; respect = 100; bullets = []; parts = [];
  form.vx = 40; buildWave(); state = 'play';
}
function say(t) { msg = t; msgT = 1.6; }

// ---------- Entrada ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => keys[e.code] = false);
function toLogical(e) { const r = cv.getBoundingClientRect(); const s = Math.min(r.width / W, r.height / H);
  return (e.clientX - r.left - (r.width - W * s) / 2) / s; }
cv.addEventListener('pointerdown', e => { if (state !== 'play') { start(); return; } touching = true; ship.x = toLogical(e); });
cv.addEventListener('pointermove', e => { if (touching) ship.x = toLogical(e); });
addEventListener('pointerup', () => touching = false);

// ---------- Lógica ----------
function explode(d, n = 5) {
  for (let i = 0; i < n; i++) parts.push({ x: d.x + form.x, y: d.y + form.y, vx: (Math.random() - .5) * 140, vy: (Math.random() - .5) * 140, l: .6, c: d.c });
}
function update(dt) {
  // nave
  const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  ship.x = Math.max(20, Math.min(W - 20, ship.x + dir * 380 * dt));
  ship.cd -= dt;
  if ((keys.Space || touching) && ship.cd <= 0) { bullets.push({ x: ship.x, y: ship.y - 14 }); ship.cd = .22; }

  // formación
  let minX = 1e9, maxX = -1e9, maxEnemyY = -1e9, enemies = 0, allies = 0;
  for (const d of dots) if (d.alive) {
    minX = Math.min(minX, d.x); maxX = Math.max(maxX, d.x);
    if (d.ally) allies++; else { enemies++; maxEnemyY = Math.max(maxEnemyY, d.y); }
  }
  form.x += form.vx * dt; form.y += form.vy * dt;
  if (minX + form.x < 10) { form.x = 10 - minX; form.vx = Math.abs(form.vx); }
  if (maxX + form.x > W - 10) { form.x = W - 10 - maxX; form.vx = -Math.abs(form.vx); }

  // balas
  for (const b of bullets) {
    b.y -= 560 * dt;
    for (const d of dots) {
      if (!d.alive) continue;
      const dx = d.x + form.x - b.x, dy = d.y + form.y - b.y;
      if (dx * dx + dy * dy < 36) {
        d.alive = false; b.y = -99; explode(d);
        if (d.ally) { respect -= 4; score = Math.max(0, score - 10); flash = .25; say('¡NO! Es de los nuestros'); }
        else score += 10;
        break;
      }
    }
  }
  bullets = bullets.filter(b => b.y > -10);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  flash = Math.max(0, flash - dt); msgT -= dt;

  // fin de ronda / derrota
  if (enemies === 0) {
    score += allies * 2; say(`¡Sancor destruido! +${allies * 2} por cuidar lo nuestro`);
    wave++; bullets = []; buildWave();
  } else if (maxEnemyY + form.y > ship.y - 20 || respect <= 0) {
    state = 'over';
  }
}

// ---------- Dibujo ----------
function glow(x, y, c, r) {
  ctx.fillStyle = c; ctx.globalAlpha = .18; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 7); ctx.fill();
  ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function draw(t) {
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = .4 + .4 * Math.sin(t * 2 + s.p); ctx.fillStyle = '#9fb4ff'; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(255,0,0,${flash})`; ctx.fillRect(0, 0, W, H); }

  for (const d of dots) if (d.alive)
    glow(d.x + form.x, d.y + form.y + Math.sin(t * 2 + d.ph) * .8, d.c, 2.1);
  for (const p of parts) { ctx.globalAlpha = p.l / .6; glow(p.x, p.y, p.c, 1.6); }
  ctx.globalAlpha = 1;
  for (const b of bullets) glow(b.x, b.y, '#7fffd4', 2.4);
  glow(ship.x, ship.y, '#7fffd4', 5); glow(ship.x - 12, ship.y + 6, '#7fffd4', 3); glow(ship.x + 12, ship.y + 6, '#7fffd4', 3);

  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '16px system-ui';
  ctx.fillText(`Puntos ${score}   Ronda ${wave}`, 14, 24);
  ctx.textAlign = 'right'; ctx.fillText('Respeto', W - 150, 24);
  ctx.strokeStyle = '#74c0f5'; ctx.strokeRect(W - 140, 11, 126, 14);
  ctx.fillStyle = '#74c0f5'; ctx.fillRect(W - 138, 13, Math.max(0, respect) * 1.22, 10);

  ctx.textAlign = 'center';
  if (msgT > 0 && state === 'play') { ctx.fillStyle = '#ffc928'; ctx.font = '20px system-ui'; ctx.fillText(msg, W / 2, H - 90); }
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5a78'; ctx.font = '900 54px Arial Black, Impact, sans-serif';
    ctx.fillText(state === 'menu' ? 'SANCOR INVADERS' : 'GAME OVER', W / 2, 220);
    ctx.fillStyle = '#fff'; ctx.font = '18px system-ui';
    if (state === 'over') ctx.fillText(`Puntos: ${score} · Ronda ${wave}`, W / 2, 262);
    ctx.fillStyle = '#ff5a78'; ctx.fillText('● Destruí los puntos rojos de Sancor', W / 2, 320);
    ctx.fillStyle = '#74c0f5'; ctx.fillText('● Cuidá la bandera y la pelota: no les dispares', W / 2, 350);
    ctx.fillStyle = '#fff'; ctx.fillText('← → mover · Espacio disparar  (celu: arrastrá)', W / 2, 390);
    ctx.fillStyle = '#ffc928'; ctx.font = '22px system-ui'; ctx.fillText('Espacio / tocá para empezar', W / 2, 450);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}
buildWave();
requestAnimationFrame(loop);
</script>
</body>
</html>
