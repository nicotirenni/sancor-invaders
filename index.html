<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sancor Invaders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;700&display=swap">
<style>
  /* Cielo nocturno: fondo Galaxy (WebGL) + juego en canvas + bloom + overlays con texto Glitch/Shiny (estilo ReactBits) */
  :root{--ink:#05060f;--red:#ff5a78;--celeste:#74c0f5;--gold:#ffc928;--mint:#7fffd4;--white:#f4f7ff;
        --display:'Anton','Impact','Arial Narrow',sans-serif;--body:'Chakra Petch','Segoe UI',system-ui,sans-serif}
  html,body{margin:0;height:100%;background:var(--ink);color:var(--white);color-scheme:dark;overflow:hidden;touch-action:none;font-family:var(--body)}
  [hidden]{display:none!important}
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;container-type:size}
  #stage{position:relative;width:min(100cqw,133.333cqh);aspect-ratio:4/3}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stage #stadium{position:absolute;left:0;bottom:0;width:100%;height:auto;display:block;pointer-events:none;opacity:.95;-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent)}
  #bloom{filter:blur(6px) brightness(1.3);mix-blend-mode:screen;opacity:.75;pointer-events:none}
  #ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;container-type:inline-size}
  .card{pointer-events:auto;background:var(--ink);border:1px solid #26305a;border-radius:6px;padding:4cqw 5cqw;text-align:center;
        box-shadow:0 0 80px rgba(255,90,120,.18),0 0 0 1px #0b0f24 inset;display:flex;flex-direction:column;gap:2.2cqw;align-items:center;max-width:86cqw;cursor:pointer}
  .card[hidden]{display:none!important}
  .kicker{font-size:1.9cqw;letter-spacing:.35em;text-transform:uppercase;color:var(--celeste);font-weight:700}
  .rules{display:flex;flex-direction:column;gap:.9cqw;font-size:2.1cqw;line-height:1.35;color:#c9d2f0}
  .rules b.r{color:var(--red)} .rules b.c{color:var(--celeste)}
  .stat{font-size:2.6cqw;font-weight:700}
  /* GlitchText (ReactBits) */
  .glitch{font-family:var(--display);font-size:9.4cqw;line-height:1;letter-spacing:.02em;white-space:nowrap;position:relative;color:var(--white);user-select:none;text-transform:uppercase}
  .glitch::after,.glitch::before{content:attr(data-text);position:absolute;top:0;color:var(--white);background-color:var(--ink);overflow:hidden;clip-path:inset(0 0 0 0)}
  .glitch::after{left:.07em;text-shadow:-.07em 0 var(--red);animation:animate-glitch 3s infinite linear alternate-reverse}
  .glitch::before{left:-.07em;text-shadow:.07em 0 var(--celeste);animation:animate-glitch 2s infinite linear alternate-reverse}
  @keyframes animate-glitch{0%{clip-path:inset(20% 0 50% 0)}5%{clip-path:inset(10% 0 60% 0)}10%{clip-path:inset(15% 0 55% 0)}15%{clip-path:inset(25% 0 35% 0)}20%{clip-path:inset(30% 0 40% 0)}25%{clip-path:inset(40% 0 20% 0)}30%{clip-path:inset(10% 0 60% 0)}35%{clip-path:inset(15% 0 55% 0)}40%{clip-path:inset(25% 0 35% 0)}45%{clip-path:inset(30% 0 40% 0)}50%{clip-path:inset(20% 0 50% 0)}55%{clip-path:inset(10% 0 60% 0)}60%{clip-path:inset(15% 0 55% 0)}65%{clip-path:inset(25% 0 35% 0)}70%{clip-path:inset(30% 0 40% 0)}75%{clip-path:inset(40% 0 20% 0)}80%{clip-path:inset(20% 0 50% 0)}85%{clip-path:inset(10% 0 60% 0)}90%{clip-path:inset(15% 0 55% 0)}95%{clip-path:inset(25% 0 35% 0)}100%{clip-path:inset(30% 0 40% 0)}}
  /* ShinyText (ReactBits) */
  .shiny{display:inline-block;color:#8fa0d0;background:linear-gradient(110deg,#8fa0d0 35%,#fff 50%,#8fa0d0 65%);background-size:220% 100%;
         -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 2.4s linear infinite}
  @keyframes shine{0%{background-position:150% 0}100%{background-position:-50% 0}}
  .cta{font-size:2.6cqw;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  #banner{position:absolute;left:0;right:0;top:44%;text-align:center;font-family:var(--display);font-size:8cqw;letter-spacing:.06em;text-transform:uppercase;
          pointer-events:none;opacity:0;transform:scale(.9);transition:opacity .35s,transform .35s}
  #banner.on{opacity:1;transform:scale(1)}
  #banner small{display:block;font-family:var(--body);font-size:2.2cqw;letter-spacing:.3em;color:var(--celeste);margin-top:.6cqw;-webkit-text-fill-color:var(--celeste)}
  @media (prefers-reduced-motion:reduce){.glitch::before,.glitch::after,.shiny{animation:none}}
</style>
</head>

<script>
// ================= Fondo Galaxy (shader de ReactBits, portado a WebGL puro) =================
const GALAXY_FS = `
precision highp float;

uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform bool uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform bool uTransparent;
uniform float uLightMode;

varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float tri(float x) {
  return abs(fract(x) * 2.0 - 1.0);
}

float tris(float x) {
  float t = fract(x);
  return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
}

float trisn(float x) {
  float t = fract(x);
  return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}

vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);

  vec2 gv = fract(uv) - 0.5; 
  vec2 id = floor(uv);

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));

      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;

      float star = Star(gv - offset - pad, flareSize);
      vec3 color = base;

      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      
      col += star * size * color;
    }
  }

  return col;
}

void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

  vec2 mouseNorm = uMouse - vec2(0.5);
  
  if (uAutoCenterRepulsion > 0.0) {
    vec2 centerUV = vec2(0.0, 0.0);
    float centerDist = length(uv - centerUV);
    vec2 repulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1));
    uv += repulsion * 0.05;
  } else if (uMouseRepulsion) {
    vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
    float mouseDist = length(uv - mousePosUV);
    vec2 repulsion = normalize(uv - mousePosUV) * (uRepulsionStrength / (mouseDist + 0.1));
    uv += repulsion * 0.05 * uMouseActiveFactor;
  } else {
    vec2 mouseOffset = mouseNorm * 0.1 * uMouseActiveFactor;
    uv += mouseOffset;
  }

  float autoRotAngle = uTime * uRotationSpeed;
  mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
  uv = autoRot * uv;

  uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

  vec3 col = vec3(0.0);

  for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
    float depth = fract(i + uStarSpeed * uSpeed);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    col += StarLayer(uv * scale + i * 453.32) * fade;
  }

  if (uLightMode > 0.5) {
    float energy = max(max(col.r, col.g), col.b);
    float coverage = clamp(smoothstep(0.0, 0.42, energy) * 0.92, 0.0, 0.92);
    vec3 ink = clamp(col * 0.48, 0.0, 0.82);
    gl_FragColor = vec4(mix(vec3(1.0), ink, coverage), 1.0);
  } else if (uTransparent) {
    float alpha = length(col);
    alpha = smoothstep(0.0, 0.3, alpha);
    alpha = min(alpha, 1.0);
    gl_FragColor = vec4(col, alpha);
  } else {
    gl_FragColor = vec4(col, 1.0);
  }
}
`;
const bgc = document.getElementById('bg');
const gl = bgc.getContext('webgl', { antialias: false });
let galaxy = null;
const galaxyState = { hue: 210, mouse: [.5, .5], active: 0 };
if (gl) {
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, 'attribute vec2 position;varying vec2 vUv;void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.,1.);}'));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, GALAXY_FS));
  gl.linkProgram(prog);
  if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'position'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(prog, n);
    galaxy = { u: {} };
    ['uTime','uResolution','uFocal','uRotation','uStarSpeed','uDensity','uHueShift','uSpeed','uMouse','uGlowIntensity','uSaturation','uMouseRepulsion',
     'uTwinkleIntensity','uRotationSpeed','uRepulsionStrength','uMouseActiveFactor','uAutoCenterRepulsion','uTransparent','uLightMode'].forEach(n => galaxy.u[n] = U(n));
    gl.uniform2f(galaxy.u.uFocal, .5, .5); gl.uniform2f(galaxy.u.uRotation, 1, 0);
    gl.uniform1f(galaxy.u.uDensity, 1.1); gl.uniform1f(galaxy.u.uSpeed, 1); gl.uniform1f(galaxy.u.uGlowIntensity, .38);
    gl.uniform1f(galaxy.u.uSaturation, .7); gl.uniform1i(galaxy.u.uMouseRepulsion, 1); gl.uniform1f(galaxy.u.uTwinkleIntensity, .4);
    gl.uniform1f(galaxy.u.uRotationSpeed, .04); gl.uniform1f(galaxy.u.uRepulsionStrength, 1.4); gl.uniform1f(galaxy.u.uAutoCenterRepulsion, 0);
    gl.uniform1i(galaxy.u.uTransparent, 0); gl.uniform1f(galaxy.u.uLightMode, 0);
  }
}
function resizeBg() {
  const d = Math.min(devicePixelRatio || 1, 1.5);
  bgc.width = Math.floor(bgc.clientWidth * d); bgc.height = Math.floor(bgc.clientHeight * d);
  if (galaxy) { gl.viewport(0, 0, bgc.width, bgc.height); gl.uniform3f(galaxy.u.uResolution, bgc.width, bgc.height, bgc.width / bgc.height); }
}
addEventListener('resize', resizeBg); resizeBg();
function drawBg(t) {
  if (!galaxy) return;
  galaxyState.active += (1 - galaxyState.active) * .05;
  gl.uniform1f(galaxy.u.uTime, t); gl.uniform1f(galaxy.u.uStarSpeed, t * .06);
  gl.uniform1f(galaxy.u.uHueShift, galaxyState.hue);
  gl.uniform2f(galaxy.u.uMouse, galaxyState.mouse[0], galaxyState.mouse[1]);
  gl.uniform1f(galaxy.u.uMouseActiveFactor, galaxyState.active);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ================= Juego =================
const W = 800, H = 600, SC = 1.5;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const bloomCv = document.getElementById('bloom'), bctx = bloomCv.getContext('2d');
const $ = id => document.getElementById(id);
const RED = '#ff5a78', CELESTE = '#74c0f5', GOLD = '#ffc928', MINT = '#7fffd4';

// ---------- Sprites -> puntos ----------
const STEP = 8, R = 3;
function sample(w, h, draw, tint) {
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const g = o.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, w, h); draw(g, w, h);
  const d = g.getImageData(0, 0, w, h).data, pts = [];
  for (let y = STEP / 2; y < h; y += STEP) for (let x = STEP / 2; x < w; x += STEP) {
    const i = (Math.floor(y) * w + Math.floor(x)) * 4;
    if (d[i] + d[i + 1] + d[i + 2] > 150) pts.push({ x, y, c: tint || `rgb(${d[i]},${d[i + 1]},${d[i + 2]})` });
  }
  return pts;
}
const FONT = `900 %spx Arial Black, Impact, sans-serif`;
function textSprite(txt, w, h, color) {
  return sample(w, h, (g) => {
    g.fillStyle = color; g.textBaseline = 'middle'; g.textAlign = 'center';
    let size = h; g.font = FONT.replace('%s', size);
    while (g.measureText(txt).width > w - 4) { size -= 2; g.font = FONT.replace('%s', size); }
    g.fillText(txt, w / 2, h / 2 + 2);
  });
}
const logoSprite = () => sample(136, 136, (g, w, h) => {
  g.strokeStyle = RED; g.lineWidth = 9; g.lineJoin = 'round';
  g.beginPath(); g.arc(w / 2, h / 2, 60, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(12, h / 2); g.lineTo(w - 12, h / 2); g.stroke();
  g.beginPath(); g.moveTo(40, 54); g.lineTo(80, 24); g.lineTo(80, 54); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(56, 82); g.lineTo(56, 112); g.lineTo(96, 82); g.closePath(); g.stroke();
});
const flagSprite = () => sample(90, 63, (g, w, h) => {
  g.fillStyle = CELESTE; g.fillRect(0, 0, w, h / 3); g.fillStyle = '#fff'; g.fillRect(0, h / 3, w, h / 3);
  g.fillStyle = CELESTE; g.fillRect(0, 2 * h / 3, w, h / 3); g.fillStyle = GOLD; g.beginPath(); g.arc(w / 2, h / 2, 8, 0, 7); g.fill();
});
const ballSprite = () => sample(72, 72, (g, w, h) => {
  g.fillStyle = '#fff'; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 2, 0, 7); g.fill(); g.fillStyle = '#000'; g.beginPath();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; g.lineTo(w / 2 + Math.cos(a) * 12, h / 2 + Math.sin(a) * 12); }
  g.fill();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; g.beginPath(); g.arc(w / 2 + Math.cos(a) * 25, h / 2 + Math.sin(a) * 25, 6, 0, 7); g.fill(); }
});
const tenSprite = () => textSprite('10', 72, 63, CELESTE);
const starSprite = () => sample(72, 72, (g, w, h) => {
  g.fillStyle = GOLD; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 15 : 34; g.lineTo(w / 2 + Math.cos(a) * r, h / 2 + Math.sin(a) * r); }
  g.fill();
});
const ALLY_SPRITES = [flagSprite, ballSprite, tenSprite, starSprite];

// ---------- Glow sprites (aditivos) ----------
const glowCache = {};
function glowSprite(c) {
  if (glowCache[c]) return glowCache[c];
  const s = 64, o = document.createElement('canvas'); o.width = o.height = s; const g = o.getContext('2d');
  const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(.1, '#ffffff'); gr.addColorStop(.26, c); gr.addColorStop(.5, c + '66');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  return glowCache[c] = o;
}
function toHex(c) { // rgb(...) o #hex -> #rrggbb
  if (c[0] === '#') return c;
  const m = c.match(/\d+/g).map(Number); return '#' + m.map(v => v.toString(16).padStart(2, '0')).join('');
}
function dot(x, y, c, r, a = 1) {
  const sp = glowSprite(toHex(c)), s = r * 4.4;
  ctx.globalAlpha = a; ctx.drawImage(sp, x - s / 2, y - s / 2, s, s);
}

// ---------- Estado ----------
let state = 'menu', wave = 1, score = 0, respect = 100, flash = 0, shake = 0, combo = 0, comboT = 0, mult = 1, hudMsg = '', hudMsgT = 0, shieldT = 0;
let danger = false;
let groups = [], bullets = [], parts = [], rings = [], pops = [], items = [];
const POWERUP_SCORE = 4000;
const STADIUM_TOP = 462; // el Monumental ocupa la franja de abajo; Sancor no debe tocarlo
const crowd = Array.from({ length: 90 }, () => ({ x: rnd0(10, W - 10), y: rnd0(STADIUM_TOP + 6, H - 24), p: Math.random() * 6, c: Math.random() < .3 ? '#74c0f5' : '#ffffff' }));
function rnd0(a, b) { return a + Math.random() * (b - a); }
let powerupsOn = false, itemT = 6, buffs = { triple: 0, rapid: 0 };
const POWERS = {
  triple: { label: 'x3', name: 'DISPARO TRIPLE', c: '#74c0f5' },
  rapid:  { label: '»',  name: 'FUEGO RÁPIDO',   c: '#7fffd4' },
  heal:   { label: '+',  name: 'RESPETO +25',    c: '#ffffff' },
  bomb:   { label: '★',  name: '¡GOLAZO!',       c: '#ffc928' }
};

const ship = { x: W / 2, y: H - 54, cd: 0, vx: 0, tilt: 0 };
const keys = {}; let touching = false;
const rnd = (a, b) => a + Math.random() * (b - a);
const ease = k => 1 - Math.pow(1 - k, 3);

function makeGroup(pts, x, y, vx, vy, ally) {
  let w = 0, h = 0; pts.forEach(p => { w = Math.max(w, p.x + STEP / 2); h = Math.max(h, p.y + STEP / 2); });
  return { x, y, vx, vy, ally, w, h, ph: Math.random() * 6, age: 0,
    dots: pts.map(p => ({ x: p.x, y: p.y, c: p.c, alive: true, delay: Math.random() * .9,
      sx: rnd(-40, W + 40), sy: rnd(H * .55, H + 80) })) };
}
function dpos(g, d) { // los drones vuelan a su lugar al comenzar la ronda
  const k = (g.age - d.delay) / .7;
  if (k >= 1) { d.ready = true; return [g.x + d.x, g.y + d.y]; }
  d.ready = false;
  if (k <= 0) return [d.sx, d.sy];
  const e = ease(k); return [d.sx + (g.x + d.x - d.sx) * e, d.sy + (g.y + d.y - d.sy) * e];
}
function buildWave() {
  groups = [];
  const sp = 1 + (wave - 1) * .18;
  const dots = [];
  logoSprite().forEach(p => dots.push(p));
  textSprite('SANCOR', 400, 64, RED).forEach(p => dots.push({ ...p, x: p.x + 152, y: p.y + 4 }));
  textSprite('SEGUROS', 400, 64, RED).forEach(p => dots.push({ ...p, x: p.x + 152, y: p.y + 68 }));
  const sancor = makeGroup(dots, 0, 36, 45 * sp, 4 * sp, false);
  sancor.x = (W - sancor.w) / 2; groups.push(sancor);
  if (wave >= 2) {
    const n = wave - 1; // ronda 2: 1 elemento, ronda 3: 2, ... uno más por nivel
    for (let i = 0; i < n; i++)
      groups.push(makeGroup(ALLY_SPRITES[i % ALLY_SPRITES.length](), rnd(0, W - 120), 180 + (i % 4) * 50 + rnd(0, 14), (i % 2 ? 1 : -1) * rnd(50, 100) * sp, 0, true));
  }
  galaxyState.hue = 210 + (wave - 1) * 40;
  banner(`Ronda ${wave}`, wave === 1 ? 'Destruí a Sancor' : 'No toques lo nuestro');
}
function banner(t, sub) {
  $('bannerText').textContent = t; $('bannerSub').textContent = sub; $('banner').classList.add('on');
  clearTimeout(banner.t); banner.t = setTimeout(() => $('banner').classList.remove('on'), 1700);
}
function start() {
  $('rules').hidden = false; $('stat').hidden = true; $('title').textContent = $('title').dataset.text = 'Sancor Invaders'; $('kicker').textContent = 'Show de drones'; $('cta').textContent = 'Espacio o tocá para empezar';
  wave = 1; score = 0; respect = 100; combo = 0; mult = 1; bullets = []; parts = []; rings = []; pops = []; items = [];
  powerupsOn = false; itemT = 6; buffs = { triple: 0, rapid: 0 };
  $('card').hidden = true; state = 'play'; buildWave();
}
function endGame(why = 'Fin del show') {
  state = 'over'; $('card').hidden = false; $('banner').classList.remove('on');
  $('kicker').textContent = why; $('title').textContent = $('title').dataset.text = 'Game over';
  $('rules').hidden = true; $('stat').hidden = false; $('stat').textContent = `${score} puntos · Ronda ${wave}`;
  $('cta').textContent = 'Espacio o tocá para reintentar';
  $('rules').hidden = true;
}
$('card').addEventListener('pointerdown', e => { e.preventDefault(); if (state !== 'play') start(); });

// ---------- Entrada ----------
addEventListener('keydown', e => {
  keys[e.code] = true; if (e.code === 'Space') e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => keys[e.code] = false);
const stage = $('stage');
function toLogical(e) { const r = stage.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
stage.addEventListener('pointerdown', e => { if (state === 'play') { touching = true; ship.x = toLogical(e); } });
stage.addEventListener('pointermove', e => { if (touching) ship.x = toLogical(e); });
addEventListener('pointerup', () => touching = false);

// ---------- Efectos ----------
function burst(x, y, c, n, sp = 150) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = rnd(.2, 1) * sp;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: rnd(.4, .9), m: .9, c, s: rnd(.8, 1.6) }); }
}
function say(t) { hudMsg = t; hudMsgT = 1.6; }
function collect(it) {
  const P = POWERS[it.type];
  rings.push({ x: it.x, y: it.y, r: 6, l: .6, c: P.c }); burst(it.x, it.y, P.c, 18, 160);
  pops.push({ x: it.x, y: it.y - 10, t: P.name, l: 1.2 });
  if (it.type === 'triple') buffs.triple = 10;
  else if (it.type === 'rapid') buffs.rapid = 8;
  else if (it.type === 'heal') respect = Math.min(100, respect + 25);
  else { // golazo: borra al azar buena parte de Sancor
    let n = 0;
    for (const g of groups) if (!g.ally) for (const d of g.dots) if (d.alive && d.ready && Math.random() < .4) { d.alive = false; n++; burst(g.x + d.x, g.y + d.y, d.c, 3); }
    score += n * 10; shake = 12; flash = .2;
  }
}
function update(dt) {
  // nave con inercia
  const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  const prev = ship.x;
  ship.x = Math.max(24, Math.min(W - 24, ship.x + dir * 380 * dt));
  ship.vx += ((ship.x - prev) / dt - ship.vx) * .3; ship.tilt += (ship.vx / 380 - ship.tilt) * .2;
  galaxyState.mouse[0] += (ship.x / W - galaxyState.mouse[0]) * .08; galaxyState.mouse[1] = .25;
  ship.cd -= dt;
  if ((keys.Space || touching) && ship.cd <= 0) {
    bullets.push({ x: ship.x, y: ship.y - 24, vx: 0 });
    if (buffs.triple > 0) { bullets.push({ x: ship.x - 8, y: ship.y - 20, vx: -110 }); bullets.push({ x: ship.x + 8, y: ship.y - 20, vx: 110 }); }
    ship.cd = buffs.rapid > 0 ? .085 : .2;
  }
  for (const k in buffs) buffs[k] = Math.max(0, buffs[k] - dt);
  // power-ups: caen al azar una vez superados los 4000 puntos
  if (!powerupsOn && score >= POWERUP_SCORE) { powerupsOn = true; itemT = 2; banner('¡Power-ups!', 'Agarralos con el sol'); }
  if (powerupsOn) {
    itemT -= dt;
    if (itemT <= 0) { const k = Object.keys(POWERS); items.push({ type: k[Math.floor(Math.random() * k.length)], x: rnd(40, W - 40), y: -20, ph: Math.random() * 6 }); itemT = rnd(6, 12); }
  }
  for (const it of items) {
    it.y += 85 * dt;
    const dx = it.x - ship.x, dy = it.y - ship.y;
    if (dx * dx + dy * dy < 30 * 30) { it.got = true; collect(it); }
  }
  items = items.filter(it => !it.got && it.y < H + 30);
  if (Math.random() < .8) parts.push({ x: ship.x + rnd(-3, 3), y: ship.y + 12, vx: rnd(-14, 14), vy: rnd(60, 110), l: .35, m: .35, c: Math.random() < .5 ? CELESTE : '#ffffff', s: .7 });

  let enemies = 0, allies = 0, lowest = -1e9;
  for (const g of groups) {
    g.age += dt;
    if (g.age > 1.2) { g.x += g.vx * dt; g.y += g.vy * dt; }
    if (g.x < 10) { g.x = 10; g.vx = Math.abs(g.vx); }
    if (g.x + g.w > W - 10) { g.x = W - 10 - g.w; g.vx = -Math.abs(g.vx); }
    for (const d of g.dots) if (d.alive) { if (g.ally) allies++; else { enemies++; lowest = Math.max(lowest, g.y + d.y); } }
  }

  for (const b of bullets) {
    b.y -= 640 * dt; b.x += (b.vx || 0) * dt; if (b.x < -10 || b.x > W + 10) b.y = -99;
    let best = null, bd = 64, bg = null, bp;
    for (const g of groups) for (const d of g.dots) {
      if (!d.alive) continue; const p = dpos(g, d); if (!d.ready) continue;
      const dx = p[0] - b.x, dy = p[1] - b.y, q = dx * dx + dy * dy;
      if (q < bd) { bd = q; best = d; bg = g; bp = p; }
    }
    if (!best) continue;
    b.y = -99;
    if (bg.ally) {
      best.alive = false; burst(bp[0], bp[1], best.c, 10); rings.push({ x: bp[0], y: bp[1], r: 4, l: .5, c: '#ff3040' });
      respect -= 4; score = Math.max(0, score - 10); pops.push({ x: bp[0], y: bp[1], t: '-10', l: 1, bad: true }); flash = .35; shake = 14; combo = 0; mult = 1; say('¡NO! Es de los nuestros');
    } else {
      let n = 0;
      for (const d of bg.dots) {
        if (!d.alive || !d.ready) continue;
        const dx = bg.x + d.x - bp[0], dy = bg.y + d.y - bp[1];
        if (dx * dx + dy * dy < 15 * 15) { d.alive = false; n++; burst(bg.x + d.x, bg.y + d.y, d.c, 4); }
      }
      combo += n; comboT = 1.6; mult = Math.min(5, 1 + Math.floor(combo / 12));
      const pts = n * 10 * mult; score += pts; shake = Math.min(9, shake + n * .5);
      rings.push({ x: bp[0], y: bp[1], r: 4, l: .45, c: '#ffd0da' });
      pops.push({ x: bp[0], y: bp[1], t: '+' + pts, l: .8 });
    }
  }
  bullets = bullets.filter(b => b.y > -10);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.vy *= .985; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  for (const r of rings) { r.r += 230 * dt; r.l -= dt; } rings = rings.filter(r => r.l > 0);
  for (const p of pops) { p.y -= 40 * dt; p.l -= dt; } pops = pops.filter(p => p.l > 0);
  flash = Math.max(0, flash - dt); shake *= .88; hudMsgT -= dt;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; mult = 1; } }

  if (enemies === 0 && groups.some(g => g.age > 1.2)) {
    const bonus = allies * 2; score += bonus;
    for (const g of groups) if (g.ally) for (const d of g.dots) if (d.alive && Math.random() < .3) burst(g.x + d.x, g.y + d.y, d.c, 2, 60);
    say(bonus ? `¡Sancor destruido! +${bonus} por cuidar lo nuestro` : '¡Sancor destruido!');
    wave++; bullets = []; buildWave();
  } else if (lowest + STEP / 2 > STADIUM_TOP) endGame('Sancor llegó al Monumental');
  else if (respect <= 0) endGame('Se perdió el respeto');
  danger = lowest + STEP / 2 > STADIUM_TOP - 90;
}

// ---------- Dibujo ----------
function draw(t) {
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.clearRect(0, 0, W, H);
  if (flash > 0) { ctx.fillStyle = `rgba(255,20,40,${flash * .45})`; ctx.fillRect(0, 0, W, H); }
  // hinchada: luces titilando en las tribunas del Monumental
  ctx.globalCompositeOperation = 'lighter';
  for (const c of crowd) dot(c.x, c.y, c.c, 1.1, .25 + .35 * Math.max(0, Math.sin(t * 2.2 + c.p * 3)));
  if (state === 'play' && danger) { ctx.globalAlpha = .35 + .25 * Math.sin(t * 8); ctx.strokeStyle = '#ff3040'; ctx.setLineDash([8, 8]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, STADIUM_TOP); ctx.lineTo(W, STADIUM_TOP); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; }
  ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  if (shake > .3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  ctx.globalCompositeOperation = 'lighter';

  // barrido de brillo sobre los drones (estilo ShinyText)
  const sweep = ((t * 260) % (W + 600)) - 300;
  for (const g of groups) for (const d of g.dots) if (d.alive) {
    const p = dpos(g, d);
    let a = .95, r = R;
    const q = Math.abs(p[0] + p[1] * .6 - sweep); if (q < 60 && d.ready) { const k = 1 - q / 60; r = R * (1 + .5 * k); a = 1; }
    dot(p[0], p[1] + Math.sin(t * 2 + g.ph + d.x * .05) * .9, q < 40 && d.ready ? '#ffffff' : d.c, r, a);
  }
  for (const p of parts) dot(p.x, p.y, p.c, p.s * 2.2, Math.max(0, p.l / p.m));
  for (const r of rings) { ctx.globalAlpha = Math.max(0, r.l * 1.8); ctx.strokeStyle = r.c; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  for (const b of bullets) { // tracer
    const gr = ctx.createLinearGradient(0, b.y, 0, b.y + 26); gr.addColorStop(0, CELESTE); gr.addColorStop(1, 'rgba(116,192,245,0)');
    ctx.fillStyle = gr; ctx.fillRect(b.x - 1.2, b.y, 2.4, 26); dot(b.x, b.y, '#ffffff', 3);
  }
  // power-ups cayendo
  for (const it of items) {
    const P = POWERS[it.type], pulse = 1 + .15 * Math.sin(t * 6 + it.ph);
    for (let i = 0; i < 12; i++) { const an = i * Math.PI / 6 + t * 1.5; dot(it.x + Math.cos(an) * 14 * pulse, it.y + Math.sin(an) * 14 * pulse, P.c, 2.1); }
    dot(it.x, it.y, P.c, 5, .55);
  }
  // nave: dron con tres luces en los colores de Argentina
  ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ship.tilt * .35);
  dot(0, -8, '#ffffff', 5.5); dot(-14, 6, CELESTE, 4.2); dot(14, 6, CELESTE, 4.2); dot(0, 4, GOLD, 3.2);
  ctx.globalAlpha = .6; ctx.strokeStyle = CELESTE; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(0, -8); ctx.lineTo(14, 6); ctx.closePath(); ctx.stroke();
  ctx.restore();
  ctx.restore();

  // puntos flotantes y HUD
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.textAlign = 'center';
  ctx.font = '700 15px "Chakra Petch", system-ui';
  for (const it of items) { ctx.fillStyle = '#05060f'; ctx.font = '700 13px "Chakra Petch", system-ui'; ctx.fillStyle = '#fff'; ctx.fillText(POWERS[it.type].label, it.x, it.y + 4.5); }
  ctx.font = '700 15px "Chakra Petch", system-ui';
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.l * 2); ctx.fillStyle = p.bad ? '#ff4d5e' : '#ffe3e8'; ctx.fillText(p.t, p.x, p.y - 10); }
  ctx.globalAlpha = 1;
  if (state === 'play') hud();
  // bloom barato: copia reducida del juego, difuminada por CSS
  bctx.clearRect(0, 0, 300, 225); bctx.drawImage(cv, 0, 0, 300, 225);
}
function hud() {
  ctx.textAlign = 'left'; ctx.fillStyle = '#8fa0d0'; ctx.font = '700 11px "Chakra Petch", system-ui';
  ctx.fillText('PUNTOS', 18, 24); ctx.fillText(`RONDA ${wave}`, 18, 62);
  ctx.fillStyle = '#f4f7ff'; ctx.font = '28px Anton, Impact, sans-serif'; ctx.fillText(String(score), 18, 50);
  if (mult > 1 || combo > 4) { ctx.fillStyle = GOLD; ctx.font = '700 14px "Chakra Petch", system-ui'; ctx.fillText(`COMBO x${mult}  (${combo})`, 18, 82); }
  ctx.textAlign = 'left'; ctx.font = '700 12px "Chakra Petch", system-ui'; let by2 = (mult > 1 || combo > 4) ? 102 : 82;
  for (const k of ['triple', 'rapid']) if (buffs[k] > 0) { ctx.fillStyle = POWERS[k].c; ctx.fillText(`${POWERS[k].name} ${buffs[k].toFixed(1)}s`, 18, by2); by2 += 18; }
  if (!powerupsOn) { ctx.fillStyle = '#5a6a9a'; ctx.fillText(`Power-ups a los ${POWERUP_SCORE}`, 18, by2); }
  ctx.textAlign = 'right'; ctx.fillStyle = '#8fa0d0'; ctx.font = '700 11px "Chakra Petch", system-ui'; ctx.fillText('RESPETO', W - 18, 24);
  const bw = 170, bx = W - 18 - bw, by = 32;
  ctx.fillStyle = 'rgba(116,192,245,.15)'; ctx.fillRect(bx, by, bw, 10);
  const gr = ctx.createLinearGradient(bx, 0, bx + bw, 0); gr.addColorStop(0, '#74c0f5'); gr.addColorStop(1, '#ffffff');
  ctx.fillStyle = respect < 30 ? '#ff5a78' : gr; ctx.fillRect(bx, by, Math.max(0, respect) / 100 * bw, 10);
  ctx.textAlign = 'center';
  if (hudMsgT > 0) { ctx.globalAlpha = Math.min(1, hudMsgT * 2); ctx.fillStyle = GOLD; ctx.font = '700 18px "Chakra Petch", system-ui'; ctx.fillText(hudMsg, W / 2, H - 92); ctx.globalAlpha = 1; }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt); else { for (const g of groups) g.age += dt * .0; }
  drawBg(now / 1000); draw(now / 1000);
  requestAnimationFrame(loop);
}
buildWave(); $('banner').classList.remove('on');
// en el menú los drones ya están armados detrás del cartel
groups.forEach(g => g.age = 3);
requestAnimationFrame(loop);
</script>
