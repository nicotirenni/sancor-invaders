<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sancor Invaders</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="c" width="800" height="600"></canvas>
<script>
const W = 800, H = 600;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- Sprites -> puntos ----------
const STEP = 8;      // separación entre drones (más grande = menos puntos)
const R = 2.6;        // radio de cada punto
function sample(w, h, draw, tint) {
  const o = document.createElement('canvas'); o.width = w; o.height = h;
  const g = o.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  draw(g, w, h);
  const d = g.getImageData(0, 0, w, h).data, pts = [];
  for (let y = STEP / 2; y < h; y += STEP)
    for (let x = STEP / 2; x < w; x += STEP) {
      const i = (Math.floor(y) * w + Math.floor(x)) * 4;
      if (d[i] + d[i + 1] + d[i + 2] > 150)
        pts.push({ x, y, c: tint || `rgb(${d[i]},${d[i + 1]},${d[i + 2]})` });
    }
  return pts;
}
function textSprite(txt, w, h, color) {
  return sample(w, h, (g) => {
    g.fillStyle = color; g.textBaseline = 'middle'; g.textAlign = 'center';
    let size = h;
    g.font = `900 ${size}px Arial Black, Impact, sans-serif`;
    while (g.measureText(txt).width > w - 4) { size -= 2; g.font = `900 ${size}px Arial Black, Impact, sans-serif`; }
    g.fillText(txt, w / 2, h / 2 + 2);
  });
}
const RED = '#ff5a78', CELESTE = '#74c0f5';
const logoSprite = () => sample(136, 136, (g, w, h) => {
  g.strokeStyle = RED; g.lineWidth = 9; g.lineJoin = 'round';
  g.beginPath(); g.arc(w / 2, h / 2, 60, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(12, h / 2); g.lineTo(w - 12, h / 2); g.stroke();
  g.beginPath(); g.moveTo(40, 54); g.lineTo(80, 24); g.lineTo(80, 54); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(56, 82); g.lineTo(56, 112); g.lineTo(96, 82); g.closePath(); g.stroke();
});
const flagSprite = () => sample(90, 63, (g, w, h) => {
  g.fillStyle = CELESTE; g.fillRect(0, 0, w, h / 3);
  g.fillStyle = '#fff'; g.fillRect(0, h / 3, w, h / 3);
  g.fillStyle = CELESTE; g.fillRect(0, 2 * h / 3, w, h / 3);
  g.fillStyle = '#ffc928'; g.beginPath(); g.arc(w / 2, h / 2, 8, 0, 7); g.fill();
});
const ballSprite = () => sample(72, 72, (g, w, h) => {
  g.fillStyle = '#fff'; g.beginPath(); g.arc(w / 2, h / 2, w / 2 - 2, 0, 7); g.fill();
  g.fillStyle = '#000';
  g.beginPath();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; g.lineTo(w / 2 + Math.cos(a) * 12, h / 2 + Math.sin(a) * 12); }
  g.fill();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; g.beginPath(); g.arc(w / 2 + Math.cos(a) * 25, h / 2 + Math.sin(a) * 25, 6, 0, 7); g.fill(); }
});
const tenSprite = () => textSprite('10', 72, 63, CELESTE);
const starSprite = () => sample(72, 72, (g, w, h) => {
  g.fillStyle = '#ffc928'; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 15 : 34; g.lineTo(w / 2 + Math.cos(a) * r, h / 2 + Math.sin(a) * r); }
  g.fill();
});
const ALLY_SPRITES = [flagSprite, ballSprite, tenSprite, starSprite];

// ---------- Estado ----------
let state = 'menu', wave = 1, score = 0, respect = 100, flash = 0, msg = '', msgT = 0;
let groups = [], bullets = [], parts = [];
const ship = { x: W / 2, y: H - 40, cd: 0 };
const keys = {};
let touching = false;

const stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.3 + .3, p: Math.random() * 6 }));

function makeGroup(pts, x, y, vx, vy, ally) {
  let w = 0, h = 0; pts.forEach(p => { w = Math.max(w, p.x + STEP / 2); h = Math.max(h, p.y + STEP / 2); });
  return { x, y, vx, vy, ally, w, h, ph: Math.random() * 6,
    dots: pts.map(p => ({ x: p.x, y: p.y, c: p.c, alive: true })) };
}
function buildWave() {
  groups = [];
  const sp = 1 + (wave - 1) * .18;
  // Sancor: logo + texto. Siempre presente.
  const dots = [];
  logoSprite().forEach(p => dots.push(p));
  textSprite('SANCOR', 400, 64, RED).forEach(p => dots.push({ ...p, x: p.x + 152, y: p.y + 4 }));
  textSprite('SEGUROS', 400, 64, RED).forEach(p => dots.push({ ...p, x: p.x + 152, y: p.y + 68 }));
  const sancor = makeGroup(dots, 0, 30, 45 * sp, 4 * sp, false);
  sancor.x = (W - sancor.w) / 2;
  groups.push(sancor);
  // Desde la ronda 2: elementos que NO hay que disparar cruzando por el medio.
  if (wave >= 2) {
    const n = Math.min(2 + wave, 6);
    for (let i = 0; i < n; i++) {
      const g = makeGroup(ALLY_SPRITES[i % ALLY_SPRITES.length](), Math.random() * (W - 120), 190 + (i % 3) * 75 + Math.random() * 20,
        (i % 2 ? 1 : -1) * (50 + Math.random() * 50) * sp, 0, true);
      groups.push(g);
    }
  }
  // Sancor se menea verticalmente entre los aliados
}
function start() {
  wave = 1; score = 0; respect = 100; bullets = []; parts = [];
  buildWave(); state = 'play';
}
function say(t) { msg = t; msgT = 1.6; }

// ---------- Entrada ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => keys[e.code] = false);
function toLogical(e) { const r = cv.getBoundingClientRect(); const s = Math.min(r.width / W, r.height / H);
  return (e.clientX - r.left - (r.width - W * s) / 2) / s; }
cv.addEventListener('pointerdown', e => { if (state !== 'play') { start(); return; } touching = true; ship.x = toLogical(e); });
cv.addEventListener('pointermove', e => { if (touching) ship.x = toLogical(e); });
addEventListener('pointerup', () => touching = false);

// ---------- Lógica ----------
function explode(x, y, c, n = 5) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 140, vy: (Math.random() - .5) * 140, l: .6, c });
}
function update(dt) {
  const dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  ship.x = Math.max(20, Math.min(W - 20, ship.x + dir * 380 * dt));
  ship.cd -= dt;
  if ((keys.Space || touching) && ship.cd <= 0) { bullets.push({ x: ship.x, y: ship.y - 14 }); ship.cd = .22; }

  // movimiento de grupos
  let enemies = 0, allies = 0, lowest = -1e9;
  for (const g of groups) {
    g.x += g.vx * dt; g.y += g.vy * dt;
    if (g.x < 10) { g.x = 10; g.vx = Math.abs(g.vx); }
    if (g.x + g.w > W - 10) { g.x = W - 10 - g.w; g.vx = -Math.abs(g.vx); }
    for (const d of g.dots) if (d.alive) {
      if (g.ally) allies++; else { enemies++; lowest = Math.max(lowest, g.y + d.y); }
    }
  }

  // balas: golpea el punto más cercano; si es Sancor explota un poco alrededor
  for (const b of bullets) {
    b.y -= 560 * dt;
    let best = null, bd = 64, bg = null;
    for (const g of groups) for (const d of g.dots) {
      if (!d.alive) continue;
      const dx = g.x + d.x - b.x, dy = g.y + d.y - b.y, q = dx * dx + dy * dy;
      if (q < bd) { bd = q; best = d; bg = g; }
    }
    if (!best) continue;
    b.y = -99;
    const hx = bg.x + best.x, hy = bg.y + best.y;
    if (bg.ally) {
      best.alive = false; explode(hx, hy, best.c);
      respect -= 4; score = Math.max(0, score - 10); flash = .25; say('¡NO! Es de los nuestros');
    } else {
      for (const d of bg.dots) {
        const dx = bg.x + d.x - hx, dy = bg.y + d.y - hy;
        if (d.alive && dx * dx + dy * dy < 15 * 15) { d.alive = false; score += 10; explode(bg.x + d.x, bg.y + d.y, d.c, 3); }
      }
    }
  }
  bullets = bullets.filter(b => b.y > -10);
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.l -= dt; }
  parts = parts.filter(p => p.l > 0);
  flash = Math.max(0, flash - dt); msgT -= dt;

  if (enemies === 0) {
    const bonus = allies * 2; score += bonus;
    say(bonus ? `¡Sancor destruido! +${bonus} por cuidar lo nuestro` : '¡Sancor destruido!');
    wave++; bullets = []; buildWave();
  } else if (lowest > ship.y - 20 || respect <= 0) {
    state = 'over';
  }
}

// ---------- Dibujo ----------
function glow(x, y, c, r) {
  ctx.fillStyle = c; ctx.globalAlpha = .18; ctx.beginPath(); ctx.arc(x, y, r * 2.6, 0, 7); ctx.fill();
  ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function draw(t) {
  ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H);
  for (const s of stars) { ctx.globalAlpha = .4 + .4 * Math.sin(t * 2 + s.p); ctx.fillStyle = '#9fb4ff'; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = `rgba(255,0,0,${flash})`; ctx.fillRect(0, 0, W, H); }

  for (const g of groups) for (const d of g.dots) if (d.alive)
    glow(g.x + d.x, g.y + d.y + Math.sin(t * 2 + g.ph + d.x * .05) * .8, d.c, R);
  for (const p of parts) { ctx.globalAlpha = p.l / .6; glow(p.x, p.y, p.c, 2); }
  ctx.globalAlpha = 1;
  for (const b of bullets) glow(b.x, b.y, '#7fffd4', 2.4);
  glow(ship.x, ship.y, '#7fffd4', 5); glow(ship.x - 12, ship.y + 6, '#7fffd4', 3); glow(ship.x + 12, ship.y + 6, '#7fffd4', 3);

  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.font = '16px system-ui';
  ctx.fillText(`Puntos ${score}   Ronda ${wave}`, 14, 24);
  ctx.textAlign = 'right'; ctx.fillText('Respeto', W - 150, 24);
  ctx.strokeStyle = '#74c0f5'; ctx.strokeRect(W - 140, 11, 126, 14);
  ctx.fillStyle = '#74c0f5'; ctx.fillRect(W - 138, 13, Math.max(0, respect) * 1.22, 10);

  ctx.textAlign = 'center';
  if (msgT > 0 && state === 'play') { ctx.fillStyle = '#ffc928'; ctx.font = '20px system-ui'; ctx.fillText(msg, W / 2, H - 90); }
  if (state !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff5a78'; ctx.font = '900 54px Arial Black, Impact, sans-serif';
    ctx.fillText(state === 'menu' ? 'SANCOR INVADERS' : 'GAME OVER', W / 2, 220);
    ctx.fillStyle = '#fff'; ctx.font = '18px system-ui';
    if (state === 'over') ctx.fillText(`Puntos: ${score} · Ronda ${wave}`, W / 2, 262);
    ctx.fillStyle = '#ff5a78'; ctx.fillText('● Destruí el logo y el texto de Sancor (puntos rojos)', W / 2, 320);
    ctx.fillStyle = '#74c0f5'; ctx.fillText('● Desde la ronda 2 cruzan cosas nuestras (bandera, pelota, 10, estrellas): no les dispares', W / 2, 350);
    ctx.fillStyle = '#fff'; ctx.fillText('← → mover · Espacio disparar  (celu: arrastrá)', W / 2, 390);
    ctx.fillStyle = '#ffc928'; ctx.font = '22px system-ui'; ctx.fillText('Espacio / tocá para empezar', W / 2, 450);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  draw(now / 1000);
  requestAnimationFrame(loop);
}
buildWave();
requestAnimationFrame(loop);
</script>
</body>
</html>
