<script>
// ================= Fondo Galaxy (shader de ReactBits, portado a WebGL puro) =================
const GALAXY_FS = `
precision highp float;

uniform float uTime;
uniform vec3 uResolution;
uniform vec2 uFocal;
uniform vec2 uRotation;
uniform float uStarSpeed;
uniform float uDensity;
uniform float uHueShift;
uniform float uSpeed;
uniform vec2 uMouse;
uniform float uGlowIntensity;
uniform float uSaturation;
uniform bool uMouseRepulsion;
uniform float uTwinkleIntensity;
uniform float uRotationSpeed;
uniform float uRepulsionStrength;
uniform float uMouseActiveFactor;
uniform float uAutoCenterRepulsion;
uniform bool uTransparent;
uniform float uLightMode;

varying vec2 vUv;

#define NUM_LAYER 4.0
#define STAR_COLOR_CUTOFF 0.2
#define MAT45 mat2(0.7071, -0.7071, 0.7071, 0.7071)
#define PERIOD 3.0

float Hash21(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float tri(float x) {
  return abs(fract(x) * 2.0 - 1.0);
}

float tris(float x) {
  float t = fract(x);
  return 1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0));
}

float trisn(float x) {
  float t = fract(x);
  return 2.0 * (1.0 - smoothstep(0.0, 1.0, abs(2.0 * t - 1.0))) - 1.0;
}

vec3 hsv2rgb(vec3 c) {
  vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
  vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
  return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
}

float Star(vec2 uv, float flare) {
  float d = length(uv);
  float m = (0.05 * uGlowIntensity) / d;
  float rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * flare * uGlowIntensity;
  uv *= MAT45;
  rays = smoothstep(0.0, 1.0, 1.0 - abs(uv.x * uv.y * 1000.0));
  m += rays * 0.3 * flare * uGlowIntensity;
  m *= smoothstep(1.0, 0.2, d);
  return m;
}

vec3 StarLayer(vec2 uv) {
  vec3 col = vec3(0.0);

  vec2 gv = fract(uv) - 0.5; 
  vec2 id = floor(uv);

  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 offset = vec2(float(x), float(y));
      vec2 si = id + vec2(float(x), float(y));
      float seed = Hash21(si);
      float size = fract(seed * 345.32);
      float glossLocal = tri(uStarSpeed / (PERIOD * seed + 1.0));
      float flareSize = smoothstep(0.9, 1.0, size) * glossLocal;

      float red = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 1.0)) + STAR_COLOR_CUTOFF;
      float blu = smoothstep(STAR_COLOR_CUTOFF, 1.0, Hash21(si + 3.0)) + STAR_COLOR_CUTOFF;
      float grn = min(red, blu) * seed;
      vec3 base = vec3(red, grn, blu);
      
      float hue = atan(base.g - base.r, base.b - base.r) / (2.0 * 3.14159) + 0.5;
      hue = fract(hue + uHueShift / 360.0);
      float sat = length(base - vec3(dot(base, vec3(0.299, 0.587, 0.114)))) * uSaturation;
      float val = max(max(base.r, base.g), base.b);
      base = hsv2rgb(vec3(hue, sat, val));

      vec2 pad = vec2(tris(seed * 34.0 + uTime * uSpeed / 10.0), tris(seed * 38.0 + uTime * uSpeed / 30.0)) - 0.5;

      float star = Star(gv - offset - pad, flareSize);
      vec3 color = base;

      float twinkle = trisn(uTime * uSpeed + seed * 6.2831) * 0.5 + 1.0;
      twinkle = mix(1.0, twinkle, uTwinkleIntensity);
      star *= twinkle;
      
      col += star * size * color;
    }
  }

  return col;
}

void main() {
  vec2 focalPx = uFocal * uResolution.xy;
  vec2 uv = (vUv * uResolution.xy - focalPx) / uResolution.y;

  vec2 mouseNorm = uMouse - vec2(0.5);
  
  if (uAutoCenterRepulsion > 0.0) {
    vec2 centerUV = vec2(0.0, 0.0);
    float centerDist = length(uv - centerUV);
    vec2 repulsion = normalize(uv - centerUV) * (uAutoCenterRepulsion / (centerDist + 0.1));
    uv += repulsion * 0.05;
  } else if (uMouseRepulsion) {
    vec2 mousePosUV = (uMouse * uResolution.xy - focalPx) / uResolution.y;
    float mouseDist = length(uv - mousePosUV);
    vec2 repulsion = normalize(uv - mousePosUV) * (uRepulsionStrength / (mouseDist + 0.1));
    uv += repulsion * 0.05 * uMouseActiveFactor;
  } else {
    vec2 mouseOffset = mouseNorm * 0.1 * uMouseActiveFactor;
    uv += mouseOffset;
  }

  float autoRotAngle = uTime * uRotationSpeed;
  mat2 autoRot = mat2(cos(autoRotAngle), -sin(autoRotAngle), sin(autoRotAngle), cos(autoRotAngle));
  uv = autoRot * uv;

  uv = mat2(uRotation.x, -uRotation.y, uRotation.y, uRotation.x) * uv;

  vec3 col = vec3(0.0);

  for (float i = 0.0; i < 1.0; i += 1.0 / NUM_LAYER) {
    float depth = fract(i + uStarSpeed * uSpeed);
    float scale = mix(20.0 * uDensity, 0.5 * uDensity, depth);
    float fade = depth * smoothstep(1.0, 0.9, depth);
    col += StarLayer(uv * scale + i * 453.32) * fade;
  }

  if (uLightMode > 0.5) {
    float energy = max(max(col.r, col.g), col.b);
    float coverage = clamp(smoothstep(0.0, 0.42, energy) * 0.92, 0.0, 0.92);
    vec3 ink = clamp(col * 0.48, 0.0, 0.82);
    gl_FragColor = vec4(mix(vec3(1.0), ink, coverage), 1.0);
  } else if (uTransparent) {
    float alpha = length(col);
    alpha = smoothstep(0.0, 0.3, alpha);
    alpha = min(alpha, 1.0);
    gl_FragColor = vec4(col, alpha);
  } else {
    gl_FragColor = vec4(col, 1.0);
  }
}
`;
const bgc = document.getElementById('bg');
const gl = bgc.getContext('webgl', { antialias: false });
let galaxy = null;
const galaxyState = { hue: 0, mouse: [.5, .5], target: [.5, .5], active: 0, targetActive: 0 };
if (gl) {
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, mk(gl.VERTEX_SHADER, 'attribute vec2 position;varying vec2 vUv;void main(){vUv=position*.5+.5;gl_Position=vec4(position,0.,1.);}'));
  gl.attachShader(prog, mk(gl.FRAGMENT_SHADER, GALAXY_FS));
  gl.linkProgram(prog);
  if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'position'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = n => gl.getUniformLocation(prog, n);
    galaxy = { u: {} };
    ['uTime','uResolution','uFocal','uRotation','uStarSpeed','uDensity','uHueShift','uSpeed','uMouse','uGlowIntensity','uSaturation','uMouseRepulsion',
     'uTwinkleIntensity','uRotationSpeed','uRepulsionStrength','uMouseActiveFactor','uAutoCenterRepulsion','uTransparent','uLightMode'].forEach(n => galaxy.u[n] = U(n));
    gl.uniform2f(galaxy.u.uFocal, .5, .5); gl.uniform2f(galaxy.u.uRotation, 1, 0);
    gl.uniform1f(galaxy.u.uDensity, .4); gl.uniform1f(galaxy.u.uSpeed, .1); gl.uniform1f(galaxy.u.uGlowIntensity, .1);
    gl.uniform1f(galaxy.u.uSaturation, 0); gl.uniform1i(galaxy.u.uMouseRepulsion, 0); gl.uniform1f(galaxy.u.uTwinkleIntensity, 1);
    gl.uniform1f(galaxy.u.uRotationSpeed, .05); gl.uniform1f(galaxy.u.uRepulsionStrength, 0); gl.uniform1f(galaxy.u.uAutoCenterRepulsion, 0);
    gl.uniform1i(galaxy.u.uTransparent, 1); gl.uniform1f(galaxy.u.uLightMode, 0);
  }
}

function resizeBg() {
  const cw0 = bgc.clientWidth || 1, ch0 = bgc.clientHeight || 1, d = Math.min(devicePixelRatio || 1, 1, Math.sqrt((perf ? 3.5e5 : 6.5e5) / (cw0 * ch0))); // el shader es lo más caro: se dibuja a menor resolución
  bgc.width = Math.floor(cw0 * d); bgc.height = Math.floor(ch0 * d);
  if (galaxy) { gl.viewport(0, 0, bgc.width, bgc.height); gl.uniform3f(galaxy.u.uResolution, bgc.width, bgc.height, bgc.width / bgc.height); }
}
addEventListener('resize', resizeBg); resizeBg();
function drawBg(t) {
  if (!galaxy) return;
  const gs = galaxyState; gs.mouse[0] += (gs.target[0] - gs.mouse[0]) * .05; gs.mouse[1] += (gs.target[1] - gs.mouse[1]) * .05; gs.active += (gs.targetActive - gs.active) * .05;
  gl.uniform1f(galaxy.u.uTime, t); gl.uniform1f(galaxy.u.uStarSpeed, t * .01);
  gl.uniform1f(galaxy.u.uHueShift, galaxyState.hue);
  gl.uniform2f(galaxy.u.uMouse, galaxyState.mouse[0], galaxyState.mouse[1]);
  gl.uniform1f(galaxy.u.uMouseActiveFactor, galaxyState.active);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ================= Juego =================
const W = 800; let SC = 1.5, H = 600; // perf (declarado arriba): 0 normal, 1 sin bloom y fondo a menos fps, 2 además resolución menor

const stadiumImg = new Image(); let stadiumTile = null;
stadiumImg.onload = () => { stadiumTile = stadiumImg; layoutStadium(); };
let stadiumPxH = 0, stadiumLift = 0; // stadiumLift: en celulares el fondo sube para dejar lugar al dedo
function layoutStadium() { // el fondo ocupa todo el ancho de la pantalla; si queda muy alto se recorta el cielo de arriba (sin repetir la imagen)
  const c = document.getElementById('stadium'); if (!stadiumTile) return;
  const dpr = Math.min(devicePixelRatio || 1, 2), vw = c.parentElement.clientWidth, full = vw * stadiumTile.height / stadiumTile.width;
  const th = stadiumPxH > 0 ? Math.min(stadiumPxH, full) : full;
  c.style.height = th + 'px'; c.style.bottom = (-th * .2 + stadiumLift) + 'px'; c.width = Math.round(vw * dpr); c.height = Math.round(th * dpr);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.scale(dpr, dpr);
  g.drawImage(stadiumTile, 0, th - full, vw, full);
  if (full > th + 1) { // solo si se recortó el cielo: suavizar el corte para que no quede una línea dura
    g.globalCompositeOperation = 'destination-out'; const f = g.createLinearGradient(0, 0, 0, th * .16); f.addColorStop(0, 'rgba(0,0,0,1)'); f.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = f; g.fillRect(0, 0, vw, th * .16);
  }
}

// Invasor al estilo show real: drones solo sobre el contorno de letras y logo
const ogap = () => 9.6; // separación de drones del invasor
function ringPts(mask, w, h, gap, c) { // contorno de una máscara, con drones separados >= gap
  const on = (x, y) => x >= 0 && y >= 0 && x < w && y < h && mask[(y * w + x) * 4 + 3] > 127;
  const cell = gap, cols = Math.ceil(w / cell) + 1, grid = new Map(), out = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!on(x, y) || (on(x - 1, y) && on(x + 1, y) && on(x, y - 1) && on(x, y + 1))) continue;
    const gx = Math.floor(x / cell), gy = Math.floor(y / cell); let ok = true;
    for (let j = gy - 1; j <= gy + 1 && ok; j++) for (let i = gx - 1; i <= gx + 1 && ok; i++) {
      const l = grid.get(j * cols + i); if (l) for (const p of l) if (Math.hypot(p.x - x, p.y - y) < gap) { ok = false; break; }
    }
    if (ok) { const p = { x, y, c }; out.push(p); const k = gy * cols + gx; (grid.get(k) || grid.set(k, []).get(k)).push(p); }
  }
  return out;
}
